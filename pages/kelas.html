<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Kelas - SIMPEL SEKOLAH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper">
      <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom border-secondary">
        <i class="fas fa-graduation-cap me-2 text-primary"></i>SIMPEL
      </div>
      <div class="list-group list-group-flush my-3">
        <a href="../index.html" class="list-group-item list-group-item-action bg-transparent text-white">
          <i class="fas fa-home me-3"></i>Dashboard
        </a>
        <a href="siswa.html" class="list-group-item list-group-item-action bg-transparent text-white">
          <i class="fas fa-user-graduate me-3"></i>Data Siswa
        </a>
        <a href="guru.html" class="list-group-item list-group-item-action bg-transparent text-white">
          <i class="fas fa-chalkboard-teacher me-3"></i>Data Guru
        </a>
        <a href="kelas.html" class="list-group-item list-group-item-action bg-transparent text-white active">
          <i class="fas fa-school me-3"></i>Data Kelas
        </a>
        <a href="absensi.html" class="list-group-item list-group-item-action bg-transparent text-white">
          <i class="fas fa-clipboard-list me-3"></i>Absensi
        </a>
        <a href="laporan.html" class="list-group-item list-group-item-action bg-transparent text-white">
          <i class="fas fa-chart-bar me-3"></i>Laporan
        </a>
        <a href="pengaturan.html"
          class="list-group-item list-group-item-action bg-transparent text-white mt-4 border-top border-secondary pt-3">
          <i class="fas fa-cog me-3"></i>Pengaturan
        </a>
      </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100 bg-light">
      <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
        <div class="d-flex align-items-center">
          <i class="fas fa-align-left fs-4 me-3 cursor-pointer" id="menu-toggle"></i>
          <h5 class="mb-0 fw-bold">Data Kelas</h5>
        </div>
      </nav>

      <div class="container-fluid px-4 py-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
          <div>
            <h4 class="fw-bold mb-0">Manajemen Kelas</h4>
            <p class="text-muted mb-0">Kelola daftar kelas dan wali kelas yang bertugas.</p>
          </div>
          <div>
            <button class="btn btn-primary shadow-sm" id="btnBukaModalTambahKelas" data-bs-toggle="modal"
              data-bs-target="#modalTambahKelas">
              <i class="fas fa-plus me-2"></i>Tambah Kelas Baru
            </button>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="py-3 px-4">Nama Kelas</th>
                    <th class="py-3">Tingkat</th>
                    <th class="py-3">Wali Kelas</th>
                    <th class="py-3 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tabelDataKelas">
                  <tr>
                    <td colspan="4" class="text-center py-4 text-muted">
                      <i class="fas fa-spinner fa-spin me-2"></i>Memuat data kelas...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Kelas -->
  <div class="modal fade" id="modalTambahKelas" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-light border-bottom-0">
          <h5 class="modal-title fw-bold" id="modalKelasLabel">Tambah Kelas Baru</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="formTambahKelas">
            <input type="hidden" id="id_kelas_edit">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label fw-medium">Nama Kelas <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nama_kelas" placeholder="Contoh: VII-A" required>
              </div>
              <div class="col-md-12">
                <label class="form-label fw-medium">Tingkat <span class="text-danger">*</span></label>
                <select class="form-select" id="tingkat_kelas" required>
                  <option value="" selected disabled>Pilih Tingkat</option>
                  <option value="VII (Tujuh)">VII (Tujuh)</option>
                  <option value="VIII (Delapan)">VIII (Delapan)</option>
                  <option value="IX (Sembilan)">IX (Sembilan)</option>
                </select>
              </div>
              <div class="col-md-12">
                <label class="form-label fw-medium">Wali Kelas</label>
                <input type="text" class="form-control" id="wali_kelas" placeholder="Nama Wali Kelas">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-top-0 bg-light">
          <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary px-4" id="btnSimpanKelas">Simpan Data</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/dashboard.js"></script>
</body>

</html>
