<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi - SIMPEL SEKOLAH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper">
      <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom border-secondary">
        <i class="fas fa-graduation-cap me-2 text-primary"></i>SIMPEL
      </div>
      <div class="list-group list-group-flush my-3">
        <a href="../index.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-home me-3"></i>Dashboard</a>
        <a href="siswa.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-user-graduate me-3"></i>Data Siswa</a>
        <a href="guru.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-chalkboard-teacher me-3"></i>Data Guru</a>
        <a href="kelas.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-school me-3"></i>Data Kelas</a>
        <a href="absensi.html" class="list-group-item list-group-item-action bg-transparent text-white active"><i
            class="fas fa-clipboard-list me-3"></i>Absensi</a>
        <a href="laporan.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-chart-bar me-3"></i>Laporan</a>
        <a href="pengaturan.html"
          class="list-group-item list-group-item-action bg-transparent text-white mt-4 border-top border-secondary pt-3"><i
            class="fas fa-cog me-3"></i>Pengaturan</a>
      </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100 bg-light">
      <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
        <div class="d-flex align-items-center">
          <i class="fas fa-align-left fs-4 me-3 cursor-pointer" id="menu-toggle"></i>
          <h5 class="mb-0 fw-bold">Absensi Harian</h5>
        </div>
      </nav>

      <div class="container-fluid px-4 py-4">
        <div class="row mb-4 align-items-end">
          <div class="col-md-4">
            <label class="fw-bold mb-2">Pilih Tanggal Absensi</label>
            <input type="date" class="form-control" id="tanggalAbsensi">
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary w-100" id="btnMuatAbsensi"><i class="fas fa-search me-2"></i>Muat
              Data</button>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="py-3 px-4">NIS</th>
                    <th class="py-3">Nama Siswa</th>
                    <th class="py-3">Kelas</th>
                    <th class="py-3 text-center">Status Kehadiran</th>
                  </tr>
                </thead>
                <tbody id="tabelDataAbsensi">
                  <tr>
                    <td colspan="4" class="text-center py-4 text-muted">Silakan pilih tanggal dan klik Muat Data.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer bg-white py-3 text-end">
            <button class="btn btn-success px-4" id="btnSimpanAbsensi" style="display:none;"><i
                class="fas fa-save me-2"></i>Simpan Absensi</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/dashboard.js"></script>
</body>

</html>
