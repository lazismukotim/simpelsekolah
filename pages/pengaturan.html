<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan - SIMPEL SEKOLAH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark text-white" id="sidebar-wrapper">
      <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom border-secondary">
        <i class="fas fa-graduation-cap me-2 text-primary"></i>SIMPEL
      </div>
      <div class="list-group list-group-flush my-3">
        <a href="../index.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-home me-3"></i>Dashboard</a>
        <a href="siswa.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-user-graduate me-3"></i>Data Siswa</a>
        <a href="guru.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-chalkboard-teacher me-3"></i>Data Guru</a>
        <a href="kelas.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-school me-3"></i>Data Kelas</a>
        <a href="absensi.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-clipboard-list me-3"></i>Absensi</a>
        <a href="laporan.html" class="list-group-item list-group-item-action bg-transparent text-white"><i
            class="fas fa-chart-bar me-3"></i>Laporan</a>
        <a href="pengaturan.html"
          class="list-group-item list-group-item-action bg-transparent text-white active mt-4 border-top border-secondary pt-3"><i
            class="fas fa-cog me-3"></i>Pengaturan</a>
        <a href="#" id="btnLogout"
          class="list-group-item list-group-item-action bg-transparent text-danger mt-3 border-top border-secondary pt-3">
          <i class="fas fa-sign-out-alt me-3"></i>Keluar
        </a>
      </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100 bg-light">
      <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 px-4 shadow-sm">
        <div class="d-flex align-items-center">
          <i class="fas fa-align-left fs-4 me-3 cursor-pointer" id="menu-toggle"></i>
          <h5 class="mb-0 fw-bold">Pengaturan Sistem</h5>
        </div>
      </nav>

      <div class="container-fluid px-4 py-4">
        <div class="row">
          <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white py-3 border-bottom-0">
                <h6 class="mb-0 fw-bold"><i class="fas fa-building me-2 text-primary"></i>Profil Instansi Sekolah</h6>
              </div>
              <div class="card-body p-4">
                <form id="formPengaturan">
                  <div class="row g-3">
                    <div class="col-md-12">
                      <label class="form-label fw-medium">Nama Sekolah <span class="text-danger">*</span></label>
                      <input type="text" class="form-control" id="pengaturan_nama_sekolah" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-medium">Nama Kepala Sekolah</label>
                      <input type="text" class="form-control" id="pengaturan_nama_kepsek">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-medium">NIP Kepala Sekolah</label>
                      <input type="text" class="form-control" id="pengaturan_nip_kepsek">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-medium">Tahun Ajaran Aktif</label>
                      <input type="text" class="form-control" id="pengaturan_tahun_ajaran"
                        placeholder="Contoh: 2026/2027">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-medium">Semester</label>
                      <select class="form-select" id="pengaturan_semester">
                        <option value="Ganjil">Ganjil</option>
                        <option value="Genap">Genap</option>
                      </select>
                    </div>
                    <div class="col-md-12">
                      <label class="form-label fw-medium">Alamat Sekolah</label>
                      <textarea class="form-control" id="pengaturan_alamat" rows="3"></textarea>
                    </div>
                    <div class="col-md-12 mt-4">
                      <button type="button" class="btn btn-primary px-4" id="btnSimpanPengaturan">
                        <i class="fas fa-save me-2"></i>Simpan Perubahan
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/dashboard.js"></script>
</body>

</html>
